name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - staging
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify formatting and tests
        run: ./gradlew --no-daemon spotlessCheck test

  publish-image:
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'staging' || github.ref_name == 'main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/typeitorg/boero-api:sha-${{ github.sha }}
            ghcr.io/typeitorg/boero-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
