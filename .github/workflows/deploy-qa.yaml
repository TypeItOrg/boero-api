name: Deploy QA

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from develop with a published immutable image
        required: true
        type: string

concurrency:
  group: deploy-qa-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate QA version
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin develop
          git cat-file -e "${COMMIT_SHA}^{commit}"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/develop

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify immutable image is available
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: docker buildx imagetools inspect "ghcr.io/typeitorg/boero-api:sha-$COMMIT_SHA" > /dev/null

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy api to QA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/boero-infra && flock /tmp/boero-infra-git.lock git pull --ff-only && make deploy-api ENV=qa VERSION=sha-$COMMIT_SHA"
