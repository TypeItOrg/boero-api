services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    command: ["/bin/sh", "/usr/local/bin/postgres-entrypoint.sh"]
    environment:
      POSTGRES_DB: postgres
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro

volumes:
  postgres-data:
