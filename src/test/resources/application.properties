spring.application.name=boero-api-test
spring.datasource.url=jdbc:h2:mem:boero-api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=0123456789abcdef0123456789abcdef
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.remember-me-token-expiration=30d

spring.data.redis.host=localhost
spring.data.redis.port=6379
