spring.application.name=boero-api-test
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:boero-api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.sql.init.mode=never
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=0123456789abcdef0123456789abcdef
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.remember-me-token-expiration=30d
app.auth.refresh-replay.encryption-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
app.auth.refresh-replay.ttl=5s
app.webauthn.rp-id=localhost
app.webauthn.rp-name=Boero
app.webauthn.allowed-origins=http://localhost:3000
app.webauthn.challenge-ttl=PT5M
app.webauthn.login-attempt-ttl=PT5M
app.webauthn.max-passkeys=10
app.webauthn.recent-auth-ttl=PT5M
app.auth.rate-limit.key-secret=test-only-rate-limit-key-secret
app.auth.rate-limit.identify-ip-max=30
app.auth.rate-limit.identify-ip-window=PT1M
app.auth.rate-limit.identify-account-max=10
app.auth.rate-limit.identify-account-window=PT1M
app.auth.rate-limit.password-max=10
app.auth.rate-limit.password-window=PT1M
app.auth.rate-limit.password-ip-max=30
app.auth.rate-limit.password-ip-window=PT1M
app.auth.rate-limit.webauthn-max=20
app.auth.rate-limit.webauthn-window=PT1M
app.auth.rate-limit.webauthn-ip-max=60
app.auth.rate-limit.webauthn-ip-window=PT1M
app.auth.rate-limit.re-auth-max=10
app.auth.rate-limit.re-auth-window=PT1M
app.auth.rate-limit.re-auth-ip-max=30
app.auth.rate-limit.re-auth-ip-window=PT1M
app.auth.rate-limit.recovery-request-ip-max=10
app.auth.rate-limit.recovery-request-ip-window=PT1M
app.auth.rate-limit.recovery-request-account-max=5
app.auth.rate-limit.recovery-request-account-window=PT5M
app.auth.rate-limit.password-reset-ip-max=10
app.auth.rate-limit.password-reset-ip-window=PT1M

app.platform-admin.email=admin@plataforma.com
app.platform-admin.password=admin123
app.platform-admin.name=Administrador
app.platform-admin.last-name=Plataforma

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple

spring.mail.host=localhost
spring.mail.port=1025
