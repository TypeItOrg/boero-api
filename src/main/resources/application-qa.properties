# QA uses its own real PostgreSQL/Redis/storage; never test/H2 or create-drop.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
server.forward-headers-strategy=native
logging.level.org.springframework=INFO
logging.level.ar.edu.utn.frvm.typeit=INFO
logging.file.name=/app/logs/boero-api.log
logging.logback.rollingpolicy.file-name-pattern=/app/logs/archive/boero-api-%d{yyyy-MM-dd}.%i.log.gz

app.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

# WebAuthnDeploymentGuard remains active because QA is neither dev nor test.
app.webauthn.rp-id=${WEBAUTHN_RP_ID}
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
