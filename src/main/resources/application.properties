spring.application.name=boero-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=true
springdoc.enable-default-api-docs=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.supported-submit-methods=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.sql.init.mode=never

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=
spring.flyway.validate-migration-naming=true

spring.lifecycle.timeout-per-shutdown-phase=20s

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.remember-me-token-expiration=30d
app.auth.refresh-replay.encryption-key=${REFRESH_REPLAY_ENCRYPTION_KEY}
app.auth.refresh-replay.ttl=${REFRESH_REPLAY_TTL:5s}
app.auth.password-recovery.frontend-url=${PASSWORD_RECOVERY_FRONTEND_URL:http://localhost:3000}
app.auth.password-recovery.token-expiration=${PASSWORD_RECOVERY_TOKEN_EXPIRATION:30m}
app.webauthn.rp-id=${WEBAUTHN_RP_ID}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Boero}
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS}
app.webauthn.challenge-ttl=${WEBAUTHN_CHALLENGE_TTL:PT5M}
app.webauthn.login-attempt-ttl=${WEBAUTHN_LOGIN_ATTEMPT_TTL:PT5M}
app.webauthn.max-passkeys=${WEBAUTHN_MAX_PASSKEYS:10}
app.webauthn.recent-auth-ttl=${WEBAUTHN_RECENT_AUTH_TTL:PT5M}
app.auth.rate-limit.key-secret=${AUTH_RATE_LIMIT_KEY_SECRET:dev-only-insecure-rate-limit-key}
app.auth.rate-limit.identify-ip-max=${RATE_LIMIT_IDENTIFY_IP_MAX:30}
app.auth.rate-limit.identify-ip-window=${RATE_LIMIT_IDENTIFY_IP_WINDOW:PT1M}
app.auth.rate-limit.identify-account-max=${RATE_LIMIT_IDENTIFY_ACCOUNT_MAX:10}
app.auth.rate-limit.identify-account-window=${RATE_LIMIT_IDENTIFY_ACCOUNT_WINDOW:PT1M}
app.auth.rate-limit.password-max=${RATE_LIMIT_PASSWORD_MAX:10}
app.auth.rate-limit.password-window=${RATE_LIMIT_PASSWORD_WINDOW:PT1M}
app.auth.rate-limit.password-ip-max=${RATE_LIMIT_PASSWORD_IP_MAX:30}
app.auth.rate-limit.password-ip-window=${RATE_LIMIT_PASSWORD_IP_WINDOW:PT1M}
app.auth.rate-limit.webauthn-max=${RATE_LIMIT_WEBAUTHN_MAX:20}
app.auth.rate-limit.webauthn-window=${RATE_LIMIT_WEBAUTHN_WINDOW:PT1M}
app.auth.rate-limit.webauthn-ip-max=${RATE_LIMIT_WEBAUTHN_IP_MAX:60}
app.auth.rate-limit.webauthn-ip-window=${RATE_LIMIT_WEBAUTHN_IP_WINDOW:PT1M}
app.auth.rate-limit.re-auth-max=${RATE_LIMIT_REAUTH_MAX:10}
app.auth.rate-limit.re-auth-window=${RATE_LIMIT_REAUTH_WINDOW:PT1M}
app.auth.rate-limit.re-auth-ip-max=${RATE_LIMIT_REAUTH_IP_MAX:30}
app.auth.rate-limit.re-auth-ip-window=${RATE_LIMIT_REAUTH_IP_WINDOW:PT1M}
app.auth.rate-limit.recovery-request-ip-max=${RATE_LIMIT_RECOVERY_REQUEST_IP_MAX:10}
app.auth.rate-limit.recovery-request-ip-window=${RATE_LIMIT_RECOVERY_REQUEST_IP_WINDOW:PT1M}
app.auth.rate-limit.recovery-request-account-max=${RATE_LIMIT_RECOVERY_REQUEST_ACCOUNT_MAX:5}
app.auth.rate-limit.recovery-request-account-window=${RATE_LIMIT_RECOVERY_REQUEST_ACCOUNT_WINDOW:PT5M}
app.auth.rate-limit.password-reset-ip-max=${RATE_LIMIT_PASSWORD_RESET_IP_MAX:10}
app.auth.rate-limit.password-reset-ip-window=${RATE_LIMIT_PASSWORD_RESET_IP_WINDOW:PT1M}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@boero.local}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.redis.time-to-live=5m

logging.level.root=INFO

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

logging.pattern.level=%5p [req:%X{requestId:-system}]
