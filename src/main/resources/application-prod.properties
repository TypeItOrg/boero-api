spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
server.forward-headers-strategy=native
logging.level.org.springframework=INFO
logging.level.ar.edu.utn.frvm.typeit=INFO

app.jwt.secret=${JWT_SECRET}

app.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

app.institutional-dev-user.password=${INSTITUTIONAL_DEV_USER_PASSWORD:}
