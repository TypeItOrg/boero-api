services:
  prod:
    container_name: boero-api-prod
    image: boero-api:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - path: .env.prod
        required: false
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for prod}
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: ${DB_NAME:?DB_NAME is required for prod}
      DB_USER: ${DB_USER:?DB_USER is required for prod}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required for prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    container_name: boero-api-redis-prod
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    container_name: boero-api-postgres-prod
    image: postgres:18-alpine
    command: ["/bin/sh", "/usr/local/bin/postgres-entrypoint.sh"]
    environment:
      DB_NAME: ${DB_NAME:?DB_NAME is required for prod}
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:?DB_USER is required for prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required for prod}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required for prod} -d ${DB_NAME:?DB_NAME is required for prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: boero-api-postgres-data-prod

networks:
  default:
    name: boero-api-network-prod
