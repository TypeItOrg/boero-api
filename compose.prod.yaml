services:
  app:
    container_name: boero-api-app-prod
    build:
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    container_name: boero-api-postgres-prod
    restart: unless-stopped

volumes:
  postgres-data:
    name: boero-api-postgres-data-prod

networks:
  default:
    name: boero-api-network-prod
