services:
  app:
    container_name: boero-api-app-dev
    build:
      target: dev
    command: ["/usr/local/bin/dev-entrypoint.sh"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_NAME: ${DB_NAME:-boero_db}
      DB_USER: ${DB_USER:-boero}
      DB_PASSWORD: ${DB_PASSWORD:-boero}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle

  postgres:
    container_name: boero-api-postgres-dev
    environment:
      DB_NAME: ${DB_NAME:-boero_db}
      POSTGRES_USER: ${DB_USER:-boero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boero}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-boero} -d ${DB_NAME:-boero_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

volumes:
  gradle-cache:
    name: boero-api-gradle-cache-dev
  postgres-data:
    name: boero-api-postgres-data-dev

networks:
  default:
    name: boero-api-network-dev
